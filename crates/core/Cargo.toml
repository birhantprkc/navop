[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSResponder", "NSView", "NSWindow"] }
raw-window-handle = { workspace = true, features = ["std"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { workspace = true, features = [
    "Win32_Storage_FileSystem",
] }

[build-dependencies]
dotenvy = "0.15"

[features]
# `macos-touchbar-window-hide`：关闭窗口只 `orderOut` 隐藏原生窗口，**绝不销毁**。
#
# Intel Mac 的 Touch Bar 机型在销毁原生窗口时，AppKit 的 `_NSTouchBarFinder` 会在下一个
# 显示周期里去注销一个已经 dealloc 的对象的 KVO 观察，抛出的 ObjC 异常无人接住 ⇒
# `EXC_CRASH (SIGABRT)` 闪退（navop#262 / #308 / #314，上游 zed#64819）。把「关闭」换成
# 「隐藏」可以从根上绕开这条路径，完整背景见 `docs/macos-memory-investigation.md` §10。
#
# 代价写在明处：被隐藏的原生窗口会一直占着 NSWindow / CAMetalLayer，直到进程退出，而
# Touch Bar 只存在于 Intel 机型上。所以这个兜底**只在 x86_64 macOS 发布包里开启**
# （release workflow 只为 `x86_64-apple-darwin` 传这个 feature）。未开启时所有隐藏路径
# 都退回原来的「关闭即销毁」，其他平台/架构的行为与加这套机制之前完全一致 ——
# 开关收敛在 `crate::window_close::HIDE_WINDOWS_ON_CLOSE` 一个常量上。
default = []
macos-touchbar-window-hide = []
